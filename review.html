<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your review | PrAjo Custom Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1220">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://mrnnrmyvjkyjcjnfomna.supabase.co" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/google-main.css">
<style>
:root { color-scheme: dark; --ink: #0a1220; --panel: #13213a; --panel-2: #182a47; --line: rgba(217,171,79,.22); --line-soft: rgba(245,236,220,.1); --gold: #d9ab4f; --gold-2: #f3d48a; --cream: #f5ecdc; --muted: #a3adbf; --danger: #ff7a6b; --leaf: #3bb35a;
  --f-display: "Fraunces", Georgia, serif; --f-body: "Manrope", "Helvetica Neue", system-ui, sans-serif; --f-label: "Cinzel", Georgia, serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 50% -10%, #17294a, var(--ink)); color: var(--cream); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.w { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--cream); padding: 6px 0 14px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand b { font-family: var(--f-label); letter-spacing: .14em; font-size: 13px; text-transform: uppercase; color: var(--gold-2); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.2; margin: 6px 0 8px; }
.lede { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 18px; padding: 16px; margin: 0 0 14px; }
.card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.stars { display: flex; gap: 2px; margin: 6px 0 4px; }
.stars button { flex: 0 0 auto; width: 52px; height: 52px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; font-size: 40px; line-height: 1; color: rgba(245,236,220,.25); -webkit-tap-highlight-color: transparent; }
.stars button.on { color: var(--gold); }
.stars button:focus-visible { outline: 2px solid var(--gold-2); border-radius: 12px; }
.rt { min-height: 20px; font-size: 13.5px; color: var(--gold-2); font-weight: 600; }
label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 10px 0 5px; }
textarea, input { width: 100%; font: inherit; font-size: 16px; color: var(--cream); background: var(--ink); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; }
textarea { min-height: 96px; resize: vertical; }
textarea:focus, input:focus { outline: 2px solid var(--gold); border-color: transparent; }
.cnt { text-align: right; font-size: 12px; color: var(--muted); }
.btn { display: flex; width: 100%; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; font: inherit; font-weight: 800; font-size: 16px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, #b98a32); color: #1b1305; box-shadow: 0 8px 30px rgba(217,171,79,.28); text-decoration: none; margin-top: 6px; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.line { background: none; color: var(--cream); border: 1px solid var(--line); box-shadow: none; }
.msg { border-radius: 12px; padding: 11px 14px; margin: 10px 0; font-size: 14.5px; }
.msg.err { background: rgba(255,122,107,.12); border: 1px solid rgba(255,122,107,.4); color: #ffc9c2; }
.msg.note { background: rgba(217,171,79,.1); border: 1px solid var(--line); color: var(--gold-2); }
.center { text-align: center; padding: 36px 8px; }
.big { font-size: 54px; line-height: 1; margin-bottom: 8px; }
.sk { height: 120px; border-radius: 18px; background: linear-gradient(90deg, var(--panel), var(--panel-2), var(--panel)); background-size: 200% 100%; animation: sh 1.4s infinite; margin-bottom: 14px; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.fine { color: var(--muted); font-size: 12.5px; margin-top: 16px; text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="w">
  <a class="brand" href="/"><img src="icon-192.png" alt=""><b>PrAjo Custom Studio</b></a>
  <main id="app" aria-live="polite"><div class="sk"></div><div class="sk"></div></main>
  <p class="fine">Your review is tied to your order and shows only your first name.</p>
</div>
<script>
const FN = "https://mrnnrmyvjkyjcjnfomna.supabase.co/functions/v1/checkout";
const KEY = "sb_publishable_yRYTwn_RktQUGMaqwiQVAA_Gb1ei78b";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const q = new URLSearchParams(location.search), ORDER = Number(q.get("o")), TOKEN = q.get("t") || "";
const WORDS = ["", "Poor", "Fair", "Good", "Very good", "Love it!"];
const app = $("app");
let info = null, rating = {};

async function call(body) {
  const r = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch { /* not json */ }
  if (!r.ok) { const e = new Error((j && j.error) || "Something went wrong. Please try again."); e.status = r.status; throw e; }
  return j;
}
function bad(title, text) {
  app.innerHTML = `<div class="center"><div class="big">🔗</div><h1>${esc(title)}</h1><p class="lede">${esc(text)}</p><a class="btn line" href="/">Visit the shop</a></div>`;
}
function stars(id, n) {
  return [1, 2, 3, 4, 5].map((i) => `<button type="button" class="${i <= n ? "on" : ""}" data-id="${esc(id)}" data-n="${i}" role="radio" aria-checked="${i === n}" aria-label="${i} star${i > 1 ? "s" : ""}">★</button>`).join("");
}
function render() {
  const again = info.items.some((it) => it.rating > 0);
  app.innerHTML = `<h1>${again ? "Edit your review" : "How did we do" + (info.name ? ", " + esc(info.name) : "") + "?"}</h1>
    <p class="lede">${again ? "You already reviewed this order. Change anything you like and save." : "Tap the stars for each item. Words are optional, but they help the most."}</p>
    ${info.items.map((it) => `<section class="card" data-card="${esc(it.id)}"><h2>${esc(it.name)}</h2>
      <div class="stars" role="radiogroup" aria-label="Rating for ${esc(it.name)}" id="st-${esc(it.id)}">${stars(it.id, rating[it.id] || 0)}</div>
      <div class="rt" id="rt-${esc(it.id)}">${WORDS[rating[it.id] || 0]}</div>
      <label for="tx-${esc(it.id)}">Your review (optional)</label>
      <textarea id="tx-${esc(it.id)}" maxlength="600" data-id="${esc(it.id)}" placeholder="What did you like? How did it look and feel?">${esc(it.body)}</textarea>
      <div class="cnt"><span id="ct-${esc(it.id)}">${(it.body || "").length}</span>/600</div></section>`).join("")}
    <label for="nm">Name shown with your review</label>
    <input id="nm" maxlength="30" autocomplete="given-name" placeholder="First name" value="${esc(info.savedName || info.name || "")}">
    <div id="err" class="msg err" hidden></div>
    <button class="btn" id="go" type="button">${again ? "Save changes" : "Send my review"}</button>`;
  app.querySelectorAll("textarea").forEach((t) => t.addEventListener("input", () => { $("ct-" + t.dataset.id).textContent = t.value.length; }));
}
app.addEventListener("click", (e) => {
  const b = e.target.closest(".stars button");
  if (b) {
    const id = b.dataset.id, n = +b.dataset.n; rating[id] = n;
    $("st-" + id).innerHTML = stars(id, n); $("rt-" + id).textContent = WORDS[n];
    const f = $("st-" + id).querySelector(`button[data-n="${n}"]`); f && f.focus({ preventScroll: true });
    return;
  }
  if (e.target.id === "go") submit();
});
async function submit() {
  const err = $("err"), go = $("go"); err.hidden = true;
  const reviews = info.items.filter((it) => rating[it.id] > 0).map((it) => ({ id: it.id, rating: rating[it.id], text: ($("tx-" + it.id).value || "").trim().slice(0, 600) }));
  if (!reviews.length) { err.textContent = "Please tap a star rating for at least one item."; err.hidden = false; err.scrollIntoView({ block: "center" }); return; }
  go.disabled = true; go.textContent = "Sending…";
  try {
    info.savedName = $("nm").value.trim();
    const res = await call({ action: "review_submit", orderNo: ORDER, token: TOKEN, name: $("nm").value.trim(), reviews });
    const waiting = res.saved > res.published;
    app.innerHTML = `<div class="center"><div class="big">💛</div><h1>Thank you!</h1>
      <p class="lede">${waiting ? "We got your review. We read each one before it goes on the site, so it may take a little while to appear." : "Your review is live on our site. It means a lot to a small Sacramento studio."}</p>
      <a class="btn" href="/">Back to the shop</a><button class="btn line" id="edit" type="button">Edit my review</button></div>`;
    $("edit").onclick = () => { info.items.forEach((it) => { if (rating[it.id]) { it.rating = rating[it.id]; it.body = (reviews.find((r) => r.id === it.id) || {}).text || ""; } }); render(); };
    window.scrollTo(0, 0);
  } catch (e) {
    go.disabled = false; go.textContent = "Try again";
    err.textContent = /aren't set up/i.test(e.message) ? "Reviews aren't switched on yet. Please try again in a day or two, or just reply to your email." : e.message;
    err.hidden = false; err.scrollIntoView({ block: "center" });
  }
}
(async function init() {
  if (!Number.isInteger(ORDER) || ORDER < 1 || !TOKEN) return bad("This link looks incomplete", "Please open the review link from your email again, or message us and we will send a new one.");
  try {
    info = await call({ action: "review_info", orderNo: ORDER, token: TOKEN });
    if (!info || !Array.isArray(info.items) || !info.items.length) return bad("Nothing to review", "We couldn't find items on this order.");
    info.items.forEach((it) => { if (it.rating > 0) rating[it.id] = it.rating; });
    render();
  } catch (e) {
    if (e.status === 404) bad("This link isn't valid", "Please use the link from your email, or message us and we will send a new one.");
    else if (e.status === 503) bad("Reviews aren't available yet", "Please try again later. Thank you for your patience!");
    else bad("We couldn't load your order", "Check your connection and try again.");
  }
})();
</script>
</body>
</html>
