<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play and Learn</title>
<style>
:root{--bg:#FFF8EE;--ink:#2B2B3A;--card:#fff;--mut:#6a6a7c;--line:#e7e0d2;--good:#2fa84f;--bad:#e5534b}
@media (prefers-color-scheme:dark){:root{--bg:#17161f;--ink:#f1eff7;--card:#242233;--mut:#a9a5bd;--line:#38354a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:3px solid var(--acc)}
header a.back{color:var(--ink);text-decoration:none;font-size:22px;padding:6px 10px;border-radius:12px}
header h1{font-size:clamp(16px,4vw,22px);margin:0;flex:1;line-height:1.1}
.ib{border:2px solid var(--acc);background:var(--card);color:var(--ink);border-radius:14px;min-width:44px;height:44px;font-size:20px;cursor:pointer;font-family:inherit}
.ib[aria-pressed="false"]{opacity:.45}
.ib:focus-visible,.btn:focus-visible,.thumb:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:10px 10px 0}
#stage{position:relative;flex:1;min-height:0;aspect-ratio:612/792;max-width:100%;touch-action:manipulation;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18);background:#fff}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#pgA{clip-path:inset(0 0 0 0);transition:clip-path .7s ease}
#pgA.off{clip-path:inset(0 0 0 100%)}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ring{fill:none;stroke:var(--good);stroke-width:5;animation:pop .35s ease-out}
.pulse{fill:none;stroke:#F2B705;stroke-width:6;animation:pulse 1s ease-in-out 3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
#status{min-height:30px;font-size:clamp(15px,3.6vw,19px);margin:8px 0 2px;text-align:center}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 0 8px;width:100%;max-width:620px}
.btn{border:3px solid var(--acc);background:var(--acc);color:#fff;border-radius:16px;min-height:48px;padding:0 16px;font-size:17px;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
#thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));width:100%;border-top:1px solid var(--line);scrollbar-width:thin}
.thumb{flex:0 0 auto;width:46px;height:60px;border-radius:8px;border:3px solid transparent;overflow:hidden;position:relative;cursor:pointer;background:#fff;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb.cur{border-color:var(--acc)}
.thumb .st{position:absolute;right:1px;top:1px;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none}
#lbl{position:absolute;z-index:3;transform:translate(-50%,-130%);background:#2B2B3A;color:#fff;padding:6px 12px;border-radius:14px;font-size:clamp(15px,3.4vw,20px);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#lbl.on{opacity:1}
.btn[aria-pressed=true]{background:var(--acc);color:#fff}
@media (prefers-reduced-motion:reduce){#pgA{transition:none}.ring,.pulse,.shake{animation:none}}
</style>
</head>

function speak(txt) { if (!soundOn || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; u.rate = .95; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }
const realAudio = {};
function playObj(name) {
  const o = OB[name]; if (!o) { SFX.tap(); return null; }
  if (M.snd && M.snd[name]) { try { (realAudio[name] = realAudio[name] || new Audio(M.snd[name])).currentTime = 0; if (soundOn) realAudio[name].play(); } catch (e) {} }
  else if (OS[o[1]]) OS[o[1]]();
  setTimeout(() => speak(SAY[name] || o[0]), 380); return o[0];
}
let lblT = 0;
function showLabel(txt, px, py) {
  const r = $('#stage').getBoundingClientRect(), l = $('#lbl'); const [, , ox, oy, w, h] = toPage({ clientX: r.left, clientY: r.top });
  l.textContent = txt; l.style.left = (ox + px / 612 * w) + 'px'; l.style.top = (oy + (792 - py) / 792 * h) + 'px'; l.classList.add('on'); clearTimeout(lblT); lblT = setTimeout(() => l.classList.remove('on'), 2000);
}
function objTap(ev) {
  const p = M.pages[cur], [x, y] = toPage(ev); let best = null, bd = 1e9;
  (p.objs || []).forEach(o => { const d = Math.hypot(x - o[1], y - o[2]); if (d <= o[3] * 1.05 && d < bd) { bd = d; best = o; } });
  if (!best) { SFX.tap(); return; }
  const nm = playObj(best[0]); if (nm) { showLabel(nm, best[1], best[2] + best[3] * .7); svgRing(best[1], best[2], best[3], 'pulse'); setTimeout(() => $('#ov').lastChild && $('#ov').lastChild.remove(), 1200); }
}

/* ---------- confetti ---------- */
function confetti() {
  const cv = $('#confetti'), cx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const P = Array.from({ length: 90 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * 200, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 6, c: `hsl(${Math.random() * 360},90%,60%)` }));
  let f = 0; (function step() { cx.clearRect(0, 0, cv.width, cv.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r * 1.6); }); if (++f < 130) requestAnimationFrame(step); else cx.clearRect(0, 0, cv.width, cv.height); })();
}

/* ---------- language ---------- */
const UIK = ["Back","Next","Hint","Show answer","Hide answer","Hear sounds","Read aloud","Tap the answers","found","Great!","You found them all!","Try again! Look carefully.","Do the puzzle, then tap Show answer.","Tap any picture to hear it!","Explore: tap any picture to hear it.","All books","Sound"];
let lang = store('_lang') || 'en'; if (lang !== 'en' && !(M.L && M.L[lang])) lang = 'en';
const T = en => { if (lang === 'en') return en; const i = UIK.indexOf(en); return i < 0 ? en : (M.L[lang].ui[i] || en); };
Object.keys(M.L || {}).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = M.L[k].n; $('#lang').appendChild(o); });
$('#lang').value = lang;
function applyLang() {
  const rtl = lang !== 'en' && M.L[lang].r; document.documentElement.lang = lang === 'en' ? 'en' : lang;
  $('#bPrev').innerHTML = '&#9664; ' + T('Back'); $('#bNext').innerHTML = T('Next') + ' &#9654;'; $('#bHint').textContent = T('Hint'); $('#bExp').innerHTML = '&#127911; ' + T('Hear sounds');
  $('#bSay').title = T('Read aloud'); $('#bSnd').title = T('Sound'); $('#cap').dir = rtl ? 'rtl' : 'ltr'; document.querySelector('header a.back').setAttribute('aria-label', T('All books'));
}
$('#lang').onchange = () => { lang = $('#lang').value; store('_lang', lang); applyLang(); render(); };
const capOf = p => lang === 'en' ? null : (M.L[lang].h[p.i] || null);

/* ---------- page logic ---------- */
function render() {
  const p = M.pages[cur]; found = []; showAns = false; store('_cur', cur);
  $('#pgQ').src = p.img; $('#pgQ').alt = (p.hdr[0] || p.title) + '. ' + (p.hdr[1] || '');
  const A = $('#pgA'); A.classList.add('off'); if (p.ans) A.src = p.ans; $('#ov').innerHTML = '';
  const tap = p.hot && p.hot.length; explore = !tap; expUI();
  $('#bHint').hidden = !tap; $('#bAns').hidden = !p.ans; $('#bAns').textContent = T('Show answer'); const cp = capOf(p); $('#cap').innerHTML = cp ? '<b>' + (cp[0] || '') + '</b>' + (cp[1] ? '<br>' + cp[1] : '') : '';
  $('#bPrev').disabled = cur === 0; $('#bNext').disabled = cur === M.pages.length - 1;
  $('#status').textContent = tap ? `${T('Tap the answers')}: 0 / ${p.hot.length} ${T('found')}` : (p.ans ? T('Do the puzzle, then tap Show answer.') : T('Tap any picture to hear it!'));
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('cur', i === cur));
  const ct = document.querySelector('.thumb.cur'); if (ct) ct.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function go(d) { const n = cur + d; if (n < 0 || n >= M.pages.length) return; cur = n; SFX.page(); render(); }
function toPage(ev) {
  const r = $('#stage').getBoundingClientRect(), img = $('#pgQ'), ar = 612 / 792; let w = r.width, h = r.height, ox = 0, oy = 0;
  if (w / h > ar) { w = h * ar; ox = (r.width - w) / 2; } else { h = w / ar; oy = (r.height - h) / 2; }
  const t = ev.touches ? ev.touches[0] : ev; return [((t.clientX - r.left - ox) / w) * 612, 792 - ((t.clientY - r.top - oy) / h) * 792, ox, oy, w, h];
}
function svgRing(x, y, r, cls) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', 792 - y); c.setAttribute('r', r); c.setAttribute('class', cls);
  c.style.transformOrigin = `${x}px ${792 - y}px`; $('#ov').appendChild(c); return c;
}
$('#stage').addEventListener('click', ev => {
  ac(); const p = M.pages[cur]; if (explore || !p.hot || !p.hot.length || showAns) { objTap(ev); return; }
  const [x, y] = toPage(ev); let hit = -1;
  p.hot.forEach((h, i) => { if (!found.includes(i) && Math.hypot(x - h[0], y - h[1]) <= h[2] * 1.2) hit = i; });
  if (hit >= 0) {
    found.push(hit); const h = p.hot[hit]; svgRing(h[0], h[1], h[2], 'ring'); SFX.good();
    $('#status').textContent = found.length === p.hot.length ? T('You found them all!') + ' ⭐' : `${T('Great!')} ${found.length} / ${p.hot.length} ${T('found')}`;
    if (found.length === p.hot.length) { done[cur] = 1; store('_done', done); marks(); setTimeout(() => { SFX.win(); confetti(); }, 350); }
  } else { SFX.bad(); const s = $('#stage'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); $('#status').textContent = T('Try again! Look carefully.'); }
});
function expUI() { const b = $('#bExp'); b.setAttribute('aria-pressed', explore); b.hidden = false; }
$('#bExp').onclick = () => { ac(); explore = !explore; expUI(); SFX.tap(); const p = M.pages[cur]; $('#status').textContent = explore ? T('Explore: tap any picture to hear it.') : (p.hot && p.hot.length ? `${T('Tap the answers')}: ${found.length} / ${p.hot.length} ${T('found')}` : ''); };
$('#bHint').onclick = () => { ac(); const p = M.pages[cur]; const i = p.hot.findIndex((h, k) => !found.includes(k)); if (i < 0) return; SFX.tap(); const h = p.hot[i]; const c = svgRing(h[0], h[1], h[2] + 18, 'pulse'); setTimeout(() => c.remove(), 3200); };
$('#bAns').onclick = () => {
  ac(); showAns = !showAns; const p = M.pages[cur]; $('#pgA').classList.toggle('off', !showAns); $('#bAns').textContent = showAns ? T('Hide answer') : T('Show answer');
  if (showAns) { SFX.reveal(); done[cur] = done[cur] || 0; } else SFX.tap();
};
$('#bPrev').onclick = () => { ac(); go(-1); }; $('#bNext').onclick = () => { ac(); go(1); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
let sx = null; $('#stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('#stage').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1); });

/* ---------- sound toggle and read aloud ---------- */
function sndBtn() { $('#bSnd').setAttribute('aria-pressed', soundOn); $('#bSnd').innerHTML = soundOn ? '&#128266;' : '&#128263;'; }
$('#bSnd').onclick = () => { soundOn = !soundOn; store('_snd', soundOn); sndBtn(); ac(); if (soundOn) SFX.tap(); };
$('#bSay').onclick = () => {
  ac(); const p = M.pages[cur]; if (!('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const cp = capOf(p), tl = lang !== 'en' && cp ? M.L[lang].t : ''; const vs = speechSynthesis.getVoices(); const ok = tl && vs.some(v => v.lang.toLowerCase().startsWith(tl.slice(0, 2).toLowerCase()));
  const u = new SpeechSynthesisUtterance(ok ? cp.filter(Boolean).join('. ') : [p.hdr[0] || p.title, p.hdr[1]].filter(Boolean).join('. ')); u.lang = ok ? tl : 'en-US'; u.rate = .9; u.pitch = 1.1; speechSynthesis.speak(u);

/* ---------- thumbnails ---------- */
function marks() { document.querySelectorAll('.thumb .st').forEach((s, i) => { s.textContent = done[M.pages.findIndex((_, k) => k === +s.parentNode.dataset.k)] ? '⭐' : ''; }); }
M.pages.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'thumb'; b.dataset.k = i; b.setAttribute('aria-label', 'Page ' + (i + 1) + ': ' + p.title);
