<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | PrAjo Custom Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
:root { --bg: #0d1526; --cream: #f5ecdc; --gold: #e9c46a; --muted: #b9c0cf; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--cream); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: grid; place-items: start center; padding: 28px 18px 60px; }
main { width: min(520px, 100%); display: grid; gap: 16px; }
a { color: var(--gold); } h1 { margin: 0; font: 700 28px/1.2 Georgia, serif; } p { margin: 0; color: var(--muted); }
.card { border: 1px solid rgba(245,236,220,.18); border-radius: 16px; padding: 20px; background: rgba(245,236,220,.05); display: grid; gap: 12px; }
button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #d9ab4f; color: #1a1204; font: 800 16px system-ui; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <a href="/" style="font-weight:800;letter-spacing:.24em;text-decoration:none">PRAJO</a>
  <h1>Unsubscribe</h1>
  <div class="card" id="box"><p>Checking your link…</p></div>
  <p>Questions? Email <a href="mailto:hello@prajocustomstudio.com">hello@prajocustomstudio.com</a>. See our <a href="/privacy.html">privacy policy</a>.</p>
</main>
<script>
const FN = "https://mrnnrmyvjkyjcjnfomna.supabase.co/functions/v1/inbox";
const q = new URLSearchParams(location.search), e = q.get("e") || "", t = q.get("t") || "", box = document.getElementById("box");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
if (!e || !t) box.innerHTML = "<p>This link is incomplete. Please use the Unsubscribe link in the email, or email us and we will remove you.</p>";
else {
  box.innerHTML = `<p>Stop cart reminder emails to <b style="color:#f5ecdc">${esc(e)}</b>?</p><button type="button" id="go">Yes, unsubscribe me</button>`;
  document.getElementById("go").onclick = async () => {
    box.innerHTML = "<p>Working…</p>";
    try {
      const r = await fetch(`${FN}?a=unsub&e=${encodeURIComponent(e)}&t=${encodeURIComponent(t)}`, { method: "POST" });
      const d = await r.json().catch(() => ({}));
      box.innerHTML = r.ok && d.ok ? `<p style="color:#f5ecdc"><b>Done.</b> ${esc(e)} will not get cart reminders from us again. The email saved with your cart has been removed.</p>` : `<p>${esc(d.error || "We couldn't do that. Please email us and we will remove you.")}</p>`;
    } catch (err) { box.innerHTML = "<p>We couldn't reach the server. Please try again, or email us and we will remove you.</p>"; }
  };
}
</script>
</body>
</html>
